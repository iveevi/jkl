[project]
name = "jkl"
version = "0.1.0"
description = "A markdown pager for the terminal"
readme = "README.md"
authors = [
    { name = "Venki", email = "42660556+iveevi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
jkl = "jkl:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
